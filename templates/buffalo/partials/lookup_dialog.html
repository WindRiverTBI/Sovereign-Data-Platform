<c-dialog default_open="true">
  <c-dialog.content>
    <c-dialog.header><c-dialog.title>{{ title }}</c-dialog.title></c-dialog.header>
    <form hx-post="{{ post_url }}" hx-target="#lookup-modal" hx-disabled-elt="find button[type=submit]" hx-disinherit="*" class="grid gap-5" novalidate>
      <div class="grid gap-5 sm:grid-cols-2">
        {% include "forms/field.html" with field=form.name class="sm:col-span-2" %}
        {% if "latitude" in form.fields %}{% include "forms/point_fields.html" %}{% endif %}
      </div>
      <c-dialog.footer class="gap-2">
        <c-button type="button" variant="outline" @click="hideDialog()">Cancel</c-button>
        <c-button type="submit">Save</c-button>
      </c-dialog.footer>
    </form>
  </c-dialog.content>
</c-dialog>
