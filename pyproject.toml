[project]
name = "wrtbi-buffalo"
version = "0.1.0"
description = "Wind River Tribal Buffalo Initiative: buffalo intake, condition, and sampling records."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-cotton>=2.8.0",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-simple-history>=3.13.0",
    "django-tailwind-cli>=4.8.1",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-shadcn>=1.8.0",
    "django-stubs>=6.1.2",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["buffalo/migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "C4",           # comprehensions
    "DJ",           # flake8-django
    "DTZ",          # naive datetimes
    "PTH",          # pathlib
    "RUF",
    "S",            # bandit
    "SIM",
]
ignore = ["RUF012"]  # Django's Meta/ClassVar conventions

[tool.ruff.lint.per-file-ignores]
"buffalo/tests/**" = ["S101", "S106"]

[tool.ty.environment]
python-version = "3.14"

# ty has no Django plugin yet. Django's inner `class Meta` idiom on models that
# extend an abstract base reads to ty as an incompatible override.
[[tool.ty.overrides]]
include = ["**/models.py"]
rules = { invalid-attribute-override = "ignore" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = ["--strict-markers"]
filterwarnings = [
    # WhiteNoise warns when collectstatic hasn't run, which it never has in tests.
    "ignore:No directory at:UserWarning",
]
