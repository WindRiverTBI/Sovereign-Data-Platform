# Builds the production image on every push to main and pushes it to GHCR as
# :main and :sha-<commit>. Komodo, on the server, notices the new :main digest
# and redeploys (see the WindRiverTBI/infra repo).
#
# Forgejo/Gitea Actions run this syntax too, if the repo moves off GitHub.

name: Publish image

on:
  push:
    branches: [main]
  # "Run workflow" button on the Actions page. Run it on main to publish :main.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
